[runner]
# NorMuon transformer sweep: composite embed, LM head type, trap mix.
# WSD schedule with linear decay from 100% to 10% of peak LR.
# ~262M tokens at seq_len=2048: 2000 * 8 * 8 * 2048 = 262,144,000
metrics_dir = "experiments/tier4/runs"
run_prefix = "rnd_normuon_composite"
skip_existing = true
continue_on_error = true

[base]
train_steps = 2000
batch_size = 8
grad_accum = 8
seq_len = 2048

metrics_every = 1
val_every = 100

# Yamit dataset (Qwen3 tokenizer, uint32)
data_format = "yamit"
data_path = "/data/yamit"
train_files = "/data/yamit/train/**/*.bin"
val_files = "/data/yamit/val/**/*.bin"
token_bytes_path = "experiments/yamit/tokenizer/artifacts/qwen3/token_bytes.npy"
vocab_size = 149760

seed = 42
init_mode = "default"

# NorMuon optimizer
optimizer = "normuon"
muon_lr = 0.023

# WSD schedule: S phase linearly decays from 100% to 10% of peak, D phase from 10% to 1% of peak
lr_schedule = "wsd"
warmup_frac = 0.10
wsd_decay_frac = 0.10
wsd_decay_end_frac = 0.10

[sweep]
composite_embed = [false, true]
lm_head_type = ["", "pit"]
trap_mix = [false, true]
ngpt = [false, true]
