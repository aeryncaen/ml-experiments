[runner]
# Phase A: find ideal grad-norm schedule (weight retraction OFF).
metrics_dir = "experiments/tier4/runs"
run_prefix = "rnd_sched_grad"
skip_existing = true
continue_on_error = true

[base]
# ~5M tokens at seq_len=1024: 611 * 8 * 1 * 1024 = 5,005,312
train_steps = 611
batch_size = 8
grad_accum = 1
seq_len = 1024

metrics_every = 1
val_every = 100

train_files = "experiments/tier4/data/fineweb10B/fineweb_train_*.bin"
val_files = "experiments/tier4/data/fineweb10B/fineweb_val_*.bin"

[sweep]
optimizer = ["autonormuon"]
seed = [42]

autonormuon_beta = [0.55]
autonormuon_adaptation_scope = ["neuron"]
autonormuon_ratio_pow = [1.0]
autonormuon_min_ratio = [0.0]
muon_lr = [0.023]

# Weight retraction OFF — isolate grad effect.
autonormuon_weight_schedule = ["off"]

# Grad schedule ablation — both directions:
autonormuon_grad_schedule = [
    "off",
    "always",
    "hard_off:40",
    "hard_off:80",
    "hard_off:160",
    "hard_off:320",
    "hard_off:600",
    "hard_on:40",
    "hard_on:80",
    "hard_on:160",
    "hard_on:320",
    "hard_on:600",
    "ramp_down:0-160",
    "ramp_down:0-600",
    "ramp_up:0-160",
    "ramp_up:0-600",
    "ppl",
    "ppl:0.5",
]
