[runner]
# Phase A: find ideal grad-norm schedule (weight retraction always on).
metrics_dir = "experiments/tier4/runs"
run_prefix = "rnd_sched_grad"
skip_existing = true
continue_on_error = true

[base]
# ~20M tokens at seq_len=1024: 2441 * 8 * 1 * 1024 = 19,996,672
train_steps = 2441
batch_size = 8
grad_accum = 1
seq_len = 1024

metrics_every = 1
val_every = 400

train_files = "experiments/tier4/data/fineweb10B/fineweb_train_*.bin"
val_files = "experiments/tier4/data/fineweb10B/fineweb_val_*.bin"

[sweep]
optimizer = ["autonormuon"]
seed = [42]

autonormuon_beta = [0.55]
autonormuon_adaptation_scope = ["neuron"]
autonormuon_ratio_pow = [1.0]
autonormuon_min_ratio = [0.0]

# Weight retraction OFF for all Phase A runs — isolate grad effect.
autonormuon_weight_schedule = ["off"]

# Grad schedule ablation:
#   off / always       = controls
#   hard_off:<step>    = grad norm on until step, then off
#   ramp_down:<s>-<e>  = linear fade from 1→0
#   ppl[:<power>]      = gate tracks perplexity ratio
autonormuon_grad_schedule = [
    "off",
    "always",
    "hard_off:40",
    "hard_off:80",
    "hard_off:160",
    "hard_off:320",
    "hard_off:600",
    "hard_off:1200",
    "ramp_down:0-160",
    "ramp_down:0-600",
    "ramp_down:0-1200",
    "ppl",
    "ppl:0.5",
]
