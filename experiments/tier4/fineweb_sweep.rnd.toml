[runner]
# R&D sweep orchestration (not "production").
metrics_dir = "experiments/tier4/runs"
run_prefix = "rnd_fineweb10m"
skip_existing = true
continue_on_error = true

[base]
# ~80M tokens with defaults: 611 * 32 * 1 * 4096 = 80,084,992
train_steps = 611
batch_size = 32
grad_accum = 1
seq_len = 4096

# keep trainer logging dense for analysis
metrics_every = 1
val_every = 100

# set these to your actual shard globs
train_files = "experiments/tier4/data/fineweb10B/fineweb_train_*.bin"
val_files = "experiments/tier4/data/fineweb10B/fineweb_val_*.bin"

[sweep]
optimizer = ["normuon", "autonormuon"]
seed = [1, 2, 3]

# AutoNorMuon-only knobs; ignored for non-autonormuon optimizers by runner normalization.
# Focused gnorm debugging grid + interaction ablations.
autonormuon_adapt_mode = ["gnorm"]
autonormuon_gnorm_beta = [0.85, 0.9, 0.95]
autonormuon_ratio_pow = [1.0]
autonormuon_min_ratio = [0.0]
autonormuon_var_eps = [1.0e-12]
# Hard-pruned from search space: conflict_proj=true, gnorm_source=grad, gmax_scope=global
autonormuon_conflict_proj = [false]
autonormuon_lr_scope = ["matrix", "group", "neuron"]
autonormuon_gnorm_source = ["post_ortho"]
autonormuon_gnorm_scope = ["matrix", "neuron"]
autonormuon_gmax_scope = ["matrix", "neuron"]
autonormuon_second_moment_mode = ["none", "row_mean", "matrix_norm_square"]
