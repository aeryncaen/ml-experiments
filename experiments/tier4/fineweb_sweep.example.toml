[runner]
metrics_dir = "experiments/tier4/runs"
run_prefix = "fineweb10m"
skip_existing = true
continue_on_error = true

[base]
train_steps = 611
batch_size = 8
grad_accum = 1
seq_len = 2048
metrics_every = 1
val_every = 100

# Set these to your real data patterns.
train_files = "experiments/tier4/data/fineweb10B/fineweb_train_*.bin"
val_files = "experiments/tier4/data/fineweb10B/fineweb_val_*.bin"

[sweep]
optimizer = ["normuon", "muon", "autonormuon"]
seed = [1, 2, 3]
autonormuon_beta = [0.55]
autonormuon_adaptation_scope = ["neuron"]
autonormuon_retract = ["weights", "update", "off"]
autonormuon_ratio_pow = [1.0]
autonormuon_min_ratio = [0.0]
