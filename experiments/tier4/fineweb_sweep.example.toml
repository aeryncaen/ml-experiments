[runner]
metrics_dir = "experiments/tier4/runs"
run_prefix = "fineweb10m"
skip_existing = true
continue_on_error = true

[base]
train_steps = 611
batch_size = 8
grad_accum = 1
seq_len = 2048
metrics_every = 1
val_every = 100

# Set these to your real data patterns.
train_files = "experiments/tier4/data/fineweb10B/fineweb_train_*.bin"
val_files = "experiments/tier4/data/fineweb10B/fineweb_val_*.bin"

[sweep]
optimizer = ["normuon", "muon", "autonormuon"]
seed = [1, 2, 3]
autonormuon_adapt_mode = ["gnorm", "mu_var"]
autonormuon_lr_scope = ["group", "matrix", "neuron"]
autonormuon_gnorm_source = ["post_ortho", "grad"]
autonormuon_gnorm_scope = ["matrix", "neuron"]
autonormuon_gmax_scope = ["global", "matrix", "neuron"]
autonormuon_second_moment_mode = ["none", "row_mean", "matrix_mean_square", "matrix_norm_square"]
