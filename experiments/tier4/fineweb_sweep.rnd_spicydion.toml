[runner]
# SpicyDion vs baselines on Yamit (~60M tokens).
# SpicyDion: PolarExpress+AOL, NorMuon-EMA momentum, adaptive LR, sphere retract.
metrics_dir = "experiments/tier4/runs"
run_prefix = "rnd_spicydion"
skip_existing = true
continue_on_error = true

[base]
# ~60M tokens at seq_len=1024: 1834 * 32 * 1 * 1024 = 60,063,744
train_steps = 1834
batch_size = 32
grad_accum = 1
seq_len = 1024

metrics_every = 1
val_every = 100

# Yamit dataset (Qwen3 tokenizer, uint32)
data_format = "yamit"
data_path = "/data/yamit"
train_files = "/data/yamit/train/**/*.bin"
val_files = "/data/yamit/val/**/*.bin"
token_bytes_path = "experiments/yamit/tokenizer/artifacts/qwen3/token_bytes.npy"
vocab_size = 149760

seed = 42
init_mode = "default"

[sweep]
optimizer = ["spicydion", "autonormuon", "normuon"]

# LR schedule: spicydion needs an external schedule now
lr_schedule = ["cosine", "pressure"]

# Adaptive LR mode (only affects spicydion)
# geomean: sqrt(ratio * sqrt(v)) — geometric mean of ratio and second moment
# adam: pure 1/sqrt(v) — Adam-style second moment only
# ratio: pure ratio — signal/max only (same as autonormuon)
spicydion_adaptive_lr_mode = ["geomean", "adam", "ratio"]

# LR
muon_lr = [0.023]

# Momentum beta (ef_decay for spicydion, also used as NorMuon-EMA beta)
spicydion_ef_decay = [0.95]

# Gnorm EMA beta (used by both spicydion and autonormuon)
autonormuon_beta = [0.55]

# AutoNorMuon weight mode (only affects autonormuon)
autonormuon_weight_mode = ["sphere"]
autonormuon_gnorm_mode = ["ema"]
