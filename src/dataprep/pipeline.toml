# Dataprep Pipeline Configuration
# All datasets from experiments/yamit/data/registry.py

[tokenizer]
path = "experiments/yamit/tokenizer/artifacts/qwen3/tokenizer.json"
eos_token_id = 149727

[output]
base_dir = "tokenized"
train_dir = "tokenized/train"
val_dir = "tokenized/val"
sft_dir = "tokenized/sft"
raw_dir = ".dataprep/raw"
processed_dir = ".dataprep/processed"
state_db = ".dataprep/state.db"
hf_cache = ".dataprep/hf_cache"

[defaults]
target_tokens = 1_000_000_000
val_fraction = 0.005
shard_size = 67_108_864
workers = 16
script = "scripts/_default.lua"

# ─── Web (English) ──────────────────────────────────────────────

[[dataset]]
name = "fineweb-edu"
hf_path = "HuggingFaceFW/fineweb-edu"
category = "web"
target_tokens = 5_000_000_000

[[dataset]]
name = "dclm"
hf_path = "mlfoundations/dclm-baseline-1.0"
category = "web"
target_tokens = 5_000_000_000

